[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ADSENSE_QUALITY_REDIRECTS
[[redirects]]
  from = "/ads.text"
  to = "/ads.txt"
  status = 301
[[redirects]]
  from = "/tools/openai-token-calculator/"
  to = "/pricing-research/llm-api-cost-guide/"
  status = 301
[[redirects]]
  from = "/ai-agent-cost-calculator.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/openai-ai-agent-cost-calculator.html"
  to = "/pricing-research/llm-api-cost-guide/"
  status = 301
[[redirects]]
  from = "/claude-ai-agent-cost-calculator.html"
  to = "/pricing-research/realistic-model-cost-comparison/"
  status = 301
[[redirects]]
  from = "/deepseek-ai-agent-cost-calculator.html"
  to = "/pricing-research/realistic-model-cost-comparison/"
  status = 301
[[redirects]]
  from = "/gemini-ai-agent-cost-calculator.html"
  to = "/pricing-research/realistic-model-cost-comparison/"
  status = 301
[[redirects]]
  from = "/tools/*"
  to = "/calculators/"
  status = 301
[[redirects]]
  from = "/compare/*"
  to = "/pricing-research/realistic-model-cost-comparison/"
  status = 301
[[redirects]]
  from = "/guides/*"
  to = "/pricing-research/"
  status = 301
[[redirects]]
  from = "/ai-cost-guides/*"
  to = "/guides/"
  status = 301
[[redirects]]
  from = "/author/"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
